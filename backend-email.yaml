apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: email-service
  name: email-service
  namespace: banka-4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: email-service
  strategy: {}
  template:
    metadata:
      labels:
        app: email-service
    spec:
      containers:
      - image: ghcr.io/raf-si-2025/banka-4-backend/email-service:latest
        name: email-service
        resources: {}
        env:
        - name: ENV
          value: "production"
        - name: PORT
          value: "8084"
        - name: GRPC_PORT
          value: "50054"

        - name: JWT_SECRET
          value: your_jwt_secret_key
        - name: JWT_EXPIRY
          value: "15"
        - name: REFRESH_EXPIRY_MINUTES
          value: "10080"
        - name: FAILED_LOGIN_WINDOW_MINUTES
          value: "5"
        - name: MAX_FAILED_LOGINS
          value: "4"

        - name: SMTP_HOST
          value: maildev
        - name: SMTP_PORT
          value: "587"
        - name: SMTP_USER
          value: ""
        - name: SMTP_PASS
          value: ""
        - name: EMAIL_FROM
          value: ""

        - name: FRONTEND_BASE_URL
          value: https://banka-4.radenkovic.rs

status: {}
---
apiVersion: v1
kind: Service
metadata:
  name: email-service
  labels:
    app: email-service
  namespace: banka-4
spec:
  selector:
    app: email-service
  ports:
    - name: api
      protocol: TCP
      port: 8084
      targetPort: 8084
    - name: grpc
      protocol: TCP
      port: 50054
      targetPort: 50054