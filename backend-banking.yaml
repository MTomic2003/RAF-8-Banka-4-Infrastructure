apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: banking-service
  name: banking-service
  namespace: banka-4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: banking-service
  strategy: {}
  template:
    metadata:
      labels:
        app: banking-service
    spec:
      containers:
      - image: ghcr.io/raf-si-2025/banka-4-backend/banking-service:latest
        name: banking-service
        resources: {}
        env:
        - name: ENV
          value: "production"
        - name: PORT
          value: "8081"
        - name: GRPC_PORT
          value: "50052"
        - name: JWT_SECRET
          value: your_jwt_secret_key
        - name: USER_SERVICE_ADDR
          value: "localhost:50051"
        - name: USER_SERVICE_BASE_URL
          value: http://localhost:8080
        - name: EXCHANGE_RATE_API_KEY
          value: "1b2e6dbc86b61ad24e3458ea"

        - name: DB_HOST
          value: db-primary.banka-4.svc
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: db-user
        - name: DB_PASS
          value: Pw0f6N8oCYG3ss2OWcP5g2WJ
        - name: DB_NAME
          value: "banka_db"
        - name: DB_SSLMODE
          value: "prefer"

        - name: SMTP_HOST
          value: maildev
        - name: SMTP_PORT
          value: "1025"
        - name: SMTP_USER
          value: rafbanka4@raf.rs
        - name: SMTP_PASS
          value: "0"
        - name: EMAIL_FROM
          value: rafbanka4@raf.rs

        - name: FRONTEND_BASE_URL
          value: http://localhost:5173
        - name: BACKEND_BASE_URL
          value: http://localhost:8080

        - name: REDIS_ADDR
          value: "redis:6379"
        - name: REDIS_PASSWORD
          value: ""
        - name: REDIS_DB
          value: "0"
        #- name: WORK_CODES_CACHE_TTL
        #  value: "86400000000000"
status: {}
---
apiVersion: v1
kind: Service
metadata:
  name: banking-service
  labels:
    app: banking-service
  namespace: banka-4
spec:
  selector:
    app: banking-service
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080